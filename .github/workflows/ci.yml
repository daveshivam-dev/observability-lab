# Every check that used to be a manual step before pushing.
# Tools run from pinned container images rather than third-party actions, so
# the same command works locally with Docker. See docs/decisions.md D-019.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMETHEUS_IMAGE: prom/prometheus:v3.13.1
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.28.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  sanitisation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No public IPs or real MAC addresses in tracked files
        run: python3 scripts/check-sanitisation.py

  exporter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporters/homelab-exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exporters/homelab-exporter/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: exporter
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t homelab-exporter:ci exporters/homelab-exporter
      - name: Scan (fail on fixable critical or high vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            homelab-exporter:ci

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config (syntax only; the full check needs the in-cluster service-account token)
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check config --syntax-only config/prometheus/prometheus.yml
      - name: Alert rules
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check rules config/prometheus/rules/*.yaml
      - name: Alertmanager config
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint amtool "$ALERTMANAGER_IMAGE" \
            check-config config/alertmanager/alertmanager.yml
      - name: Generated ConfigMaps match their source files
        run: |
          ./scripts/render-all.sh
          git diff --exit-code manifests/ \
            || { echo "Manifests are stale: run scripts/render-all.sh and commit."; exit 1; }
      - name: Kubernetes manifests
        run: docker run --rm -v "$PWD/manifests:/m:ro" "$KUBECONFORM_IMAGE" -strict -summary /m

  deploy:
    runs-on: ubuntu-latest
    needs: config
    env:
      KIND_VERSION: v0.27.0
      CLUSTER: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -sSLo ./kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create the cluster
        run: kind create cluster --name "$CLUSTER" --config cluster/kind-config.yaml --wait 180s

      - name: Bootstrap the namespace and secrets
        run: |
          kubectl apply -f manifests/00-namespace.yaml
          ./scripts/bootstrap-secrets.sh

      - name: Apply every manifest
        run: kubectl apply -f manifests/

      - name: Every Deployment becomes Available
        run: kubectl -n observability wait --for=condition=Available deploy --all --timeout=240s

      - name: Prometheus is ready and has loaded its rules
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9090/-/ready >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:9090/-/ready

          groups=$(curl -s http://localhost:9090/api/v1/rules \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["data"]["groups"]))')
          echo "rule groups loaded: $groups"
          test "$groups" -gt 0

      - name: Prometheus can reach the in-cluster targets
        run: |
          up=$(curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="prometheus"}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]["result"]; print(d[0]["value"][1] if d else "0")')
          echo "up{job=prometheus} = $up"
          test "$up" = "1"

      - name: Alertmanager was discovered
        run: |
          n=$(curl -s http://localhost:9090/api/v1/alertmanagers \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["data"]["activeAlertmanagers"]))')
          echo "active alertmanagers: $n"
          test "$n" -ge 1

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n observability get pods -o wide
          kubectl -n observability describe pods
          kubectl -n observability logs --all-containers --tail=200 --prefix --selector app.kubernetes.io/name=prometheus || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60

      - name: Tear down
        if: always()
        run: kind delete cluster --name "$CLUSTER"
