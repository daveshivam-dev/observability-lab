kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: observability
nodes:
  - role: control-plane
    # Pin the node image once you know your kind version: run `kind version`
    # and take the matching kindest/node tag from that release's notes.
    # image: kindest/node:v1.34.0
    extraPortMappings:
      # Prometheus NodePort 30090 -> localhost:9090
      - containerPort: 30090
        hostPort: 9090
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Grafana NodePort 30000 -> localhost:3000
      - containerPort: 30000
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
