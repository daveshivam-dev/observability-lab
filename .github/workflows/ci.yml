# Every check that used to be a manual step before pushing.
# Tools run from pinned container images rather than third-party actions, so
# the same command works locally with Docker. See docs/decisions.md D-019.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMETHEUS_IMAGE: prom/prometheus:v3.13.1
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.28.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  sanitisation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No public IPs or real MAC addresses in tracked files
        run: python3 scripts/check-sanitisation.py

  exporter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporters/homelab-exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exporters/homelab-exporter/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: exporter
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t homelab-exporter:ci exporters/homelab-exporter
      - name: Scan (fail on fixable critical or high vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            homelab-exporter:ci

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config (syntax only; the full check needs the in-cluster service-account token)
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check config --syntax-only config/prometheus/prometheus.yml
      - name: Alert rules
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check rules config/prometheus/rules/*.yaml
      - name: Alertmanager config
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint amtool "$ALERTMANAGER_IMAGE" \
            check-config config/alertmanager/alertmanager.yml
      - name: Generated ConfigMaps match their source files
        run: |
          ./scripts/render-all.sh
          git diff --exit-code manifests/ \
            || { echo "Manifests are stale: run scripts/render-all.sh and commit."; exit 1; }
      - name: Kubernetes manifests
        run: docker run --rm -v "$PWD/manifests:/m:ro" "$KUBECONFORM_IMAGE" -strict -summary /m
